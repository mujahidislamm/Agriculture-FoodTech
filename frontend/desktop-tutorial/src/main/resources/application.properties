spring.application.name=crop-disease-api
server.port=${SERVER_PORT:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:4173}

# Local TorchScript model and labels generated by train_model.py
# The bundled model is resolved relative to this backend directory after cloning.
crop.model.path=${CROP_MODEL_PATH:models/crop_model.pt}
crop.model.classes=${CROP_MODEL_CLASSES:}

# H2 stores prediction logs locally for development
spring.datasource.url=jdbc:h2:file:./data/crop-disease-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Crop image upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# External data links (optional). Open-Meteo works without a key.
weather.api-key=${OPENWEATHER_API_KEY:}
weather.base-url=${WEATHER_BASE_URL:https://api.open-meteo.com/v1}

# Official mandi source: https://www.data.gov.in/resource/current-daily-price-various-commodities-various-markets-mandi
# To enable live mandi pricing, sign up for a free API key on data.gov.in and set the values below.
# Leave the API key blank to disable official mandi data calls.
mandi.api-key=${MANDI_API_KEY:}
mandi.resource-id=${MANDI_RESOURCE_ID:9ef84268-d588-465a-a308-a864a43d0070}
mandi.base-url=${MANDI_BASE_URL:https://api.data.gov.in}
