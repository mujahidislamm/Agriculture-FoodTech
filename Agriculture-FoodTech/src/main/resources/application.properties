spring.application.name=crop-disease-api
server.port=${SERVER_PORT:8080}

# Local TorchScript model and labels generated by train_model.py
crop.model.path=${CROP_MODEL_PATH:models/crop_model.pt}
crop.model.classes=${CROP_MODEL_CLASSES:}

# H2 stores prediction logs locally for development
spring.datasource.url=jdbc:h2:file:./data/crop-disease-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Crop image upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Leave blank to disable external weather calls
weather.api-key=${OPENWEATHER_API_KEY:}
weather.base-url=${WEATHER_BASE_URL:https://api.openweathermap.org/data/2.5}

# data.gov.in API for live mandi (market) prices
# Register free at https://data.gov.in to get an API key
mandi.api-key=${DATA_GOV_API_KEY:}
mandi.base-url=${MANDI_BASE_URL:https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070}